<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-label="接入点的流程：外部事件经收件与准入变成一个会话与 Task，状态变化经发件箱投递回触发的地方" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<style>.bg{fill:#ffffff;stroke:#d0d7de}
.t{fill:#1f2328}.m{fill:#59636e}
.ln{stroke:#59636e;stroke-width:1.4;fill:none}.da{stroke-dasharray:5 4}.ah{fill:#59636e}
.go{fill:#ddf4ff;stroke:#218bff}.py{fill:#dafbe1;stroke:#2da44e}.rs{fill:#fff1e5;stroke:#e16f24}
.ext{fill:#f6f8fa;stroke:#afb8c1}.store{fill:#fbefff;stroke:#a475f9}.chip{fill:#f6f8fa;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.t{fill:#e6edf3}.m{fill:#b1bac4}
.ln{stroke:#9198a1}.ah{fill:#9198a1}
.go{fill:#0c2d6b;stroke:#388bfd}.py{fill:#0f3d1e;stroke:#2ea043}.rs{fill:#4a2409;stroke:#db6d28}
.ext{fill:#161b22;stroke:#3d444d}.store{fill:#2e1461;stroke:#8957e5}.chip{fill:#161b22;stroke:#30363d}
}</style>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="261" rx="10" class="bg"/>
<rect x="18" y="16" width="160" height="64" rx="8" class="ext" stroke-width="1.2"/>
<text x="98.0" y="35.5" class="t" font-size="13" text-anchor="middle" font-weight="600">外部事件</text>
<text x="98.0" y="52.5" class="m" font-size="11.5" text-anchor="middle">GitHub @ 评论 · 定时</text>
<text x="98.0" y="69.5" class="m" font-size="11.5" text-anchor="middle">服务器告警 · 邮件</text>
<rect x="206" y="16" width="160" height="64" rx="8" class="go" stroke-width="1.2"/>
<text x="286.0" y="35.5" class="t" font-size="13" text-anchor="middle" font-weight="600">收件与翻译</text>
<text x="286.0" y="52.5" class="m" font-size="11.5" text-anchor="middle">验签 · 去重</text>
<text x="286.0" y="69.5" class="m" font-size="11.5" text-anchor="middle">翻译成一条触发</text>
<rect x="394" y="16" width="160" height="64" rx="8" class="go" stroke-width="1.2"/>
<text x="474.0" y="35.5" class="t" font-size="13" text-anchor="middle" font-weight="600">准入</text>
<text x="474.0" y="52.5" class="m" font-size="11.5" text-anchor="middle">连接 · 身份 · 条件</text>
<text x="474.0" y="69.5" class="m" font-size="11.5" text-anchor="middle">限流 · 预算</text>
<rect x="582" y="16" width="160" height="64" rx="8" class="py" stroke-width="1.2"/>
<text x="662.0" y="35.5" class="t" font-size="13" text-anchor="middle" font-weight="600">会话与 Task</text>
<text x="662.0" y="52.5" class="m" font-size="11.5" text-anchor="middle">和网页上建的一样</text>
<text x="662.0" y="69.5" class="m" font-size="11.5" text-anchor="middle">照常看进度、审改动</text>
<path d="M178,48 L206,48" class="ln" marker-end="url(#a1)"/>
<path d="M366,48 L394,48" class="ln" marker-end="url(#a1)"/>
<path d="M554,48 L582,48" class="ln" marker-end="url(#a1)"/>
<text x="474" y="98" class="m" font-size="11.5" text-anchor="middle">拒绝时记下原因</text>
<path d="M662,80 L662,150" class="ln" marker-end="url(#a1)"/>
<text x="654" y="126" class="m" font-size="11.5" text-anchor="end">已受理 · 要确认 · 有结果 · 失败</text>
<rect x="582" y="150" width="160" height="64" rx="8" class="go" stroke-width="1.2"/>
<text x="662.0" y="169.5" class="t" font-size="13" text-anchor="middle" font-weight="600">发件箱</text>
<text x="662.0" y="186.5" class="m" font-size="11.5" text-anchor="middle">状态变化时记一条投递</text>
<text x="662.0" y="203.5" class="m" font-size="11.5" text-anchor="middle">单独重试 · 不发两遍</text>
<rect x="394" y="150" width="160" height="64" rx="8" class="go" stroke-width="1.2"/>
<text x="474.0" y="169.5" class="t" font-size="13" text-anchor="middle" font-weight="600">出口</text>
<text x="474.0" y="186.5" class="m" font-size="11.5" text-anchor="middle">按类型渲染</text>
<text x="474.0" y="203.5" class="m" font-size="11.5" text-anchor="middle">网页 · 回帖 · 邮件</text>
<rect x="206" y="150" width="160" height="64" rx="8" class="ext" stroke-width="1.2"/>
<text x="286.0" y="169.5" class="t" font-size="13" text-anchor="middle" font-weight="600">回到触发的地方</text>
<text x="286.0" y="186.5" class="m" font-size="11.5" text-anchor="middle">原 Issue 或 PR</text>
<text x="286.0" y="203.5" class="m" font-size="11.5" text-anchor="middle">同一个邮件线程</text>
<path d="M582,182 L554,182" class="ln" marker-end="url(#a1)"/>
<path d="M394,182 L366,182" class="ln" marker-end="url(#a1)"/>
<rect x="18" y="237" width="11" height="11" rx="2.5" class="go" stroke-width="1.2"/>
<text x="34" y="246" class="m" font-size="11" text-anchor="start">coding-web</text>
<rect x="113.8" y="237" width="11" height="11" rx="2.5" class="py" stroke-width="1.2"/>
<text x="129.8" y="246" class="m" font-size="11" text-anchor="start">Agent Runtime</text>
<rect x="228.74" y="237" width="11" height="11" rx="2.5" class="ext" stroke-width="1.2"/>
<text x="244.74" y="246" class="m" font-size="11" text-anchor="start">外部</text>
</svg>
