<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" role="img" aria-label="Coding Agent 的组成：浏览器与外部事件进 coding-web，coding-web 经 Task API 与 Workspace API 用 Agent Runtime" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif">
