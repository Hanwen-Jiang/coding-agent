# coding-web 上云（单节点，与 Runtime 的 docs/plan/cloud-deploy.md 第 7 节对应）：
# - 装在 agent-runtime 命名空间。工作区经 Runtime 的 Workspace API（CODING_WORKSPACES=runtime，与 Task API 同一个地址；
#   Runtime 的 D-06）：不挂 Worker 的工作区卷，换节点、换成存档模式的沙箱后端都不用改这里。
# - 令牌：Runtime 第一期仍是开发 Ingress，coding-web 用同一把开发签名密钥签 Task API 的令牌（Secret agent-runtime-secrets）。
# - 开发登录关掉（CODING_DEV_LOGIN 不设）：线上只用第三方登录，OAuth 的 Client ID 与 Secret 在 Secret coding-oauth
#   （键 CODING_GITHUB_CLIENT_ID、CODING_GITHUB_CLIENT_SECRET 等，见 cmd/coding-web 的说明）。
# - 沙箱等级经 effect_ceiling 逐个任务传给 Runtime，租户策略由 Runtime 的 Registry 定，不给 CODING_TENANT_POLICIES_FILE。
# 改 <…> 的地方：镜像、域名、放行的账号、Task API 的 Service 名（Runtime 的 Helm release 名为 ar 时是 ar-agent-runtime-task-service）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coding-data
  namespace: agent-runtime
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-web
  namespace: agent-runtime
  labels: {app.kubernetes.io/name: coding-web, app.kubernetes.io/part-of: coding-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: coding-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coding-web, app.kubernetes.io/part-of: coding-agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: coding-web
          image: ghcr.io/<所有者>/coding-web:<版本>
          ports:
            - {name: http, containerPort: 8095}
          env:
            - {name: CODING_ADDR, value: "0.0.0.0:8095"}
            - {name: CODING_TASK_API, value: "http://ar-agent-runtime-task-service:8080"}
            - {name: CODING_WORKSPACES, value: runtime}
            - {name: CODING_DATA_DIR, value: /data}
            - {name: CODING_PROFILE, value: production}
            - {name: CODING_CACHE_PREFIX, value: "coding-web:"}
            # Reuse the deployment's Valkey endpoint, with coding-web's own key
            # namespace. A missing Secret or failed connection blocks startup.
            - name: CODING_VALKEY_URL
              valueFrom:
                secretKeyRef: {name: agent-runtime-valkey, key: url}
            - {name: CODING_PUBLIC_URL, value: "https://<coding 的域名>"}
            - {name: CODING_SECURE_COOKIE, value: "1"}
            # 还没对外开放时只放行这些平台账号（逗号分隔的 <平台>:<登录名>）；删掉这一行就谁都能登录。
            - {name: CODING_ALLOWED_LOGINS, value: "<放行的账号>"}
            - {name: CODING_SANDBOX, value: sandbox}
            # 网络密钥页（WEB-SEC）：“我的 MCP”的连接引用它作鉴权头（Runtime 的 N-15），所以打开。
            - {name: CODING_NETWORK_SECRETS, value: "1"}
            # G-05：coding.github.* 指标经 Runtime 的 Collector 写进 VictoriaMetrics（Grafana 的告警读它）。
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://ar-agent-runtime-otel-collector:4318"}
            # AUTH-01（Runtime 仓库 docs/plan/auth-tokens-2026-11-03.md；线上 2026-11-06 切换）：签 Ed25519 的 JWT 给 Runtime，Runtime 只持公钥。
            # 私钥在 Secret coding-jwt（键 key.pem，task-service keygen --iss coding-agent --kid <kid> 生成），只按文件挂进来；打印的登记
            # （只有公钥）在 Runtime Chart 的 taskService.ingress.issuers。CODING_TOKEN_KEY 在 coding-oauth 里。
            # 不再有 AR_DEV_SIGNING_KEY（AUTH-01 第 4 步，线上 2026-11-06）：旧格式的平台令牌与环境密钥在启动时已全部改用 CODING_TOKEN_KEY
            # 重新加密（Server.Reseal）；Runtime 不再收开发令牌。
            - {name: CODING_JWT_KEY_FILE, value: /etc/coding/jwt/key.pem}
            - {name: CODING_JWT_KID, value: "<kid>"}
            # GitHub App（G-01，docs/plan/github-app.md 第 3 节）：App ID、Client ID、Webhook secret 在 coding-oauth 里（envFrom）；
            # 私钥单独放 Secret coding-github-app（键 private-key.pem），只按文件挂进来，不进环境变量（coding-web 起的 git 会继承
            # 环境变量）。coding-oauth 里不能再有 CODING_GITHUB_APP_PRIVATE_KEY，有的话 coding-web 拒绝启动：部署前
            #   kubectl -n agent-runtime create secret generic coding-github-app --from-file=private-key.pem=<PEM 文件>
            # 再从 coding-oauth 删掉那一项。
            - {name: CODING_GITHUB_APP_SLUG, value: coding-agent-link}
            - {name: CODING_GITHUB_APP_PRIVATE_KEY_FILE, value: /etc/coding/github-app/private-key.pem}
          envFrom:
            - secretRef: {name: coding-oauth}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: github-app, mountPath: /etc/coding/github-app, readOnly: true}
            - {name: jwt, mountPath: /etc/coding/jwt, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: coding-data}
        - name: tmp
          emptyDir: {}
        - name: github-app
          secret:
            secretName: coding-github-app
            defaultMode: 0400
            items:
              - {key: private-key.pem, path: private-key.pem}
        - name: jwt
          secret:
            secretName: coding-jwt
            defaultMode: 0400
            items:
              - {key: key.pem, path: key.pem}
---
apiVersion: v1
kind: Service
metadata:
  name: coding-web
  namespace: agent-runtime
spec:
  selector: {app.kubernetes.io/name: coding-web}
  ports:
    - {name: http, port: 8095, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coding-web
  namespace: agent-runtime
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`<coding 的域名>`)
      services:
        - name: coding-web
          port: http
          # 任务进度是 SSE（coding-web 代理 Runtime 的事件流）。
          responseForwarding: {flushInterval: 10ms}
  tls:
    secretName: cloudflare-origin-tls
